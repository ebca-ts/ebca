services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ebca_counter
      POSTGRES_USER: ebca
      POSTGRES_PASSWORD: ebca
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ebca -d ebca_counter"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats-1:
    image: nats:2.10-alpine
    command:
      - "--jetstream"
      - "--server_name=nats-1"
      - "--cluster_name=ebca-example"
      - "--cluster=nats://0.0.0.0:6222"
      - "--routes=nats://nats-2:6222,nats://nats-3:6222"
    ports:
      - "4422:4222"

  nats-2:
    image: nats:2.10-alpine
    command:
      - "--jetstream"
      - "--server_name=nats-2"
      - "--cluster_name=ebca-example"
      - "--cluster=nats://0.0.0.0:6222"
      - "--routes=nats://nats-1:6222,nats://nats-3:6222"
    ports:
      - "4423:4222"

  nats-3:
    image: nats:2.10-alpine
    command:
      - "--jetstream"
      - "--server_name=nats-3"
      - "--cluster_name=ebca-example"
      - "--cluster=nats://0.0.0.0:6222"
      - "--routes=nats://nats-1:6222,nats://nats-2:6222"
    ports:
      - "4424:4222"
